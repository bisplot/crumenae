<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crumenae</title>
  <meta name="theme-color" content="#0B0B12">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <img class="brand-mark" src="/logo.svg" alt="" width="34" height="34">
        <span class="brand-name">Crumenae</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-page="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>Dashboard</a>
        <a href="#/year-end" data-page="year-end"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Year-end</a>
        <a href="#/transactions" data-page="transactions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M16 3l4 4-4 4"/><path d="M20 17H4M8 13l-4 4 4 4"/></svg>Transactions</a>
        <a href="#/wallets" data-page="wallets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-2"/><path d="M22 11h-6a2 2 0 0 0 0 4h6z"/></svg>Wallets</a>
        <a href="#/assets" data-page="assets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>Assets</a>
        <a href="#/settings" data-page="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
      </nav>
      <div id="job" class="job hidden" role="status">
        <div class="job-head">
          <div class="job-status">
            <span id="job-icon" class="job-icon" aria-hidden="true"></span>
            <div class="job-text">
              <strong id="job-title">Sync</strong>
              <div id="job-step" class="job-step"></div>
            </div>
          </div>
          <span id="job-time" class="job-time"></span>
          <button class="btn ghost small job-close" id="job-close" type="button" title="Hide" aria-label="Hide">✕</button>
        </div>
        <div id="job-bar" class="job-bar"></div>
        <pre id="job-log"></pre>
      </div>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <label class="select-inline">
            <span class="muted">Portfolio</span>
            <select id="portfolio"><option value="">All</option></select>
          </label>
          <button class="btn" id="recompute-btn" type="button" title="Compute balances and EUR values at every fiscal-year end">Recompute year-end</button>
          <button class="btn primary" id="sync-btn" type="button">Sync now</button>
        </div>
      </header>
      <div id="banner"></div>
      <section id="page" class="page" aria-live="polite"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
