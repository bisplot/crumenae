name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # uv installs standalone CPython builds, available for 3.9 on every runner image
      # (actions/setup-python has no 3.9 build for the newest Ubuntu).
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        shell: bash
        run: >
          uv run --no-project --python ${{ matrix.python }}
          ${{ runner.os == 'Windows' && '--with tzdata' || '' }}
          python -m unittest discover -s tests -v
